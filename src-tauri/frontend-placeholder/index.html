<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TBAi</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b0d;
        color: #e7e7ea;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.85rem;
        line-height: 1.6;
        color: #9a9aa4;
        margin: 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        color: #c8c8d0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Starting the local server…</h1>
      <p>
        This window is only a placeholder. TBAi's interface is served by the
        backend on <code>127.0.0.1</code>, and the app shell navigates there once
        the server has been verified. If this message stays, the local server
        did not start — close and reopen TBAi.
      </p>
    </main>
  </body>
</html>
