name: Verify

# Deliberately independent of tauri-build.yml - there is no `needs:` between
# them and neither gates the other. The build carries a typecheck because Vite
# strips types without checking them (seconds of insurance against shipping a
# broken artifact); the ~4-minute suite lives here instead, so a slow or
# environment-dependent test can never block a release build, and a build never
# waits on a suite it cannot act on.
#
# Runs on every push to main and every PR, so suite feedback arrives on the
# code push rather than at release time.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned, matching tauri-build.yml and the version verified locally. Bun
  # releases weekly and has shipped breaking changes; `latest` made two builds
  # of one commit differ.
  BUN_VERSION: "1.4.2"

jobs:
  verify:
    # windows-latest, not ubuntu: the suite was verified green on Windows, and
    # path/port handling is OS-sensitive. Switching runners could surface
    # platform failures that were never exercised.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-v2-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # `bun run test`, NOT bare `bun test`. The bare form double-collects the
      # suites and cascades "Database has closed" across the shared test
      # database, reporting hundreds of phantom failures instead of real ones.
      # The scoped script in package.json is the only correct invocation.
      #
      # The output is teed to a file only so the diagnostic step below can
      # republish the complete failure list. `$LASTEXITCODE` is captured
      # immediately and re-thrown, so the job's verdict is identical to running
      # `bun run test` alone - verified locally for exit codes 0, 1 and 3.
      # `2>&1` folds stderr, where bun writes its summary, into the same file.
      #
      # KNOWN FAILURE (pre-existing, deliberately not fixed here):
      # tests/integration/opencode-binary-missing.test.ts self-skips when an
      # `opencode` binary is on PATH. It is on a developer's machine, so those
      # three cases pass vacuously; this runner has no binary, so they execute
      # for the first time and "a bad conversationId still 400s before the 503
      # branch" fails. Unrelated to any recent change - nothing in the opencode
      # routes was touched.
      - name: Test
        run: |
          bun run test 2>&1 | Tee-Object -FilePath test-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      # DIAGNOSTIC ONLY - no test, production, or opencode behaviour changes.
      #
      # GitHub caps check-run annotations at 10 per run, and downloading the job
      # log requires authentication, so a failing run cannot be triaged from
      # outside CI. This republishes the COMPLETE failure list and the suite
      # totals into the job summary, which renders on the public run page for
      # anyone who can read the repository. Runs only when something failed.
      #
      # Strings are single-quoted on purpose: in PowerShell a backtick is the
      # escape character, so "```" is a parse error while '```' is a literal.
      - name: Publish complete test failure list (diagnostic)
        if: failure()
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          '## Complete test failure list' | Out-File -FilePath $summary -Append -Encoding utf8
          '' | Out-File -FilePath $summary -Append -Encoding utf8
          'Every `(fail)` line reported by `bun run test`:' | Out-File -FilePath $summary -Append -Encoding utf8
          '' | Out-File -FilePath $summary -Append -Encoding utf8
          '```' | Out-File -FilePath $summary -Append -Encoding utf8
          $fails = Select-String -Path test-output.log -Pattern '^\(fail\)' | ForEach-Object { $_.Line }
          if ($fails) { $fails | Out-File -FilePath $summary -Append -Encoding utf8 } else { '(no (fail) lines captured)' | Out-File -FilePath $summary -Append -Encoding utf8 }
          '```' | Out-File -FilePath $summary -Append -Encoding utf8
          '' | Out-File -FilePath $summary -Append -Encoding utf8
          '### Suite totals' | Out-File -FilePath $summary -Append -Encoding utf8
          '' | Out-File -FilePath $summary -Append -Encoding utf8
          '```' | Out-File -FilePath $summary -Append -Encoding utf8
          $totals = Select-String -Path test-output.log -Pattern '^\s*\d+ (pass|fail|skip|todo)|^Ran ' | ForEach-Object { $_.Line }
          if ($totals) { $totals | Out-File -FilePath $summary -Append -Encoding utf8 } else { '(no suite totals captured)' | Out-File -FilePath $summary -Append -Encoding utf8 }
          '```' | Out-File -FilePath $summary -Append -Encoding utf8
