name: Tauri Build (Windows x64, portable zip)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Build the Tauri 2 desktop shell. The Rust/Tauri toolchain is NOT installed
# locally — this workflow is the only place the desktop bundle is produced.
#
# Tauri v2 has no "zip" bundle target (only deb/rpm/appimage/msi/nsis/app/dmg),
# so we compile with bundling disabled (bundle.active:false) and assemble the
# portable .zip ourselves from the compiled executable + bundled resources +
# the portable Bun sidecar. Output: a portable .zip (no installer).

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend + workspace dependencies
        run: bun install --frozen-lockfile

      - name: Download portable Bun sidecar
        shell: pwsh
        run: |
          $url = "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile bun-windows-x64.zip
          Expand-Archive -Path bun-windows-x64.zip -DestinationPath bun-extract -Force
          $binDir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $bunExe = Get-ChildItem -Path bun-extract -Recurse -Filter bun.exe | Select-Object -First 1
          if (-not $bunExe) { throw "bun.exe not found in downloaded archive" }
          Copy-Item -Path $bunExe.FullName -Destination "$binDir/bun-x86_64-pc-windows-msvc.exe" -Force
          Remove-Item -Recurse -Force bun-extract, bun-windows-x64.zip

      - name: Generate icon set from source PNG
        run: bunx tauri icon src-tauri/app-icon.png

      # bundle.active:false -> compiles the executable only (no msi/nsis). The
      # beforeBuildCommand builds dist/ (backend) and web/dist/ (frontend).
      - name: Build Tauri (compile, no bundle)
        run: bunx tauri build --target x86_64-pc-windows-msvc

      - name: Assemble portable app folder
        shell: pwsh
        run: |
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          # The compiled binary is named after the Cargo package (tbai-desktop.exe);
          # brand it as TBAi.exe in the portable folder.
          $exe = Get-ChildItem -Path $rel -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No application .exe found in $rel" }
          Copy-Item -Path $exe.FullName -Destination "$rel/TBAi.exe" -Force
          # Portable Bun sidecar next to the executable (Tauri resolves externalBin here).
          Copy-Item -Path "src-tauri/binaries/bun-x86_64-pc-windows-msvc.exe" -Destination "$rel/bun-x86_64-pc-windows-msvc.exe" -Force
          # Backend bundle + web SPA (consumed by the Bun sidecar at runtime).
          New-Item -ItemType Directory -Force -Path "$rel/backend","$rel/web" | Out-Null
          Copy-Item -Path "dist/*" -Destination "$rel/backend/" -Recurse -Force
          Copy-Item -Path "web/dist/*" -Destination "$rel/web/" -Recurse -Force

      - name: Package portable zip
        shell: pwsh
        run: |
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          Compress-Archive -Path "$rel/*" -DestinationPath "TBAi-windows-x64-portable.zip" -Force
          Write-Host "zip size: $((Get-Item TBAi-windows-x64-portable.zip).Length) bytes"
          Get-ChildItem "$rel" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbai-windows-x64-portable
          path: TBAi-windows-x64-portable.zip
          if-no-files-found: error
