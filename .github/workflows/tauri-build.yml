name: Tauri Build (Windows x64, portable zip)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Build the Tauri 2 desktop shell. The Rust/Tauri toolchain is NOT installed
# locally — this workflow is the only place the desktop bundle is produced.
#
# Tauri v2 has no "zip" bundle target (only deb/rpm/appimage/msi/nsis/app/dmg),
# so we compile with bundling disabled (bundle.active:false) and assemble the
# portable folder ourselves from the compiled executable + bundled resources +
# the portable Bun sidecar. Output: a portable folder (zipped by the artifact
# upload step — single level, no nested archive).

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          # Cache ONLY bun's global package cache, never node_modules — caching
          # node_modules (which contains bun's .bun linker dir) restores with
          # broken permissions on Windows and breaks `bun build` (EPERM).
          path: ~/.bun/install/cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-v2-${{ runner.os }}-

      - name: Install frontend + workspace dependencies
        run: bun install --frozen-lockfile

      - name: Download portable Bun sidecar
        shell: pwsh
        run: |
          $url = "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile bun-windows-x64.zip
          Expand-Archive -Path bun-windows-x64.zip -DestinationPath bun-extract -Force
          $binDir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $bunExe = Get-ChildItem -Path bun-extract -Recurse -Filter bun.exe | Select-Object -First 1
          if (-not $bunExe) { throw "bun.exe not found in downloaded archive" }
          Copy-Item -Path $bunExe.FullName -Destination "$binDir/bun-x86_64-pc-windows-msvc.exe" -Force
          Remove-Item -Recurse -Force bun-extract, bun-windows-x64.zip

      - name: Generate icon set from source PNG
        run: bunx tauri icon src-tauri/app-icon.png

      # bundle.active:false -> compiles the executable only (no msi/nsis). The
      # beforeBuildCommand builds dist/ (backend) and web/dist/ (frontend).
      - name: Build Tauri (compile, no bundle)
        run: bunx tauri build --target x86_64-pc-windows-msvc

      - name: Assemble portable app folder
        shell: pwsh
        run: |
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          # The Tauri binary is named after the Cargo package (tbai-desktop.exe).
          # Copy the app binary explicitly by its package name (never glob "*.exe"
          # — Tauri also drops the ~82 MB Bun sidecar here, so the first match
          # would be the wrong file).
          $app = "$rel/tbai-desktop.exe"
          if (-not (Test-Path $app)) { throw "tbai-desktop.exe not found at $rel" }
          Copy-Item -Path $app -Destination "$rel/TBAi.exe" -Force
          # Runtime Bun sidecar. Tauri's `sidecar("bun")` resolves the binary as
          # `bun.exe` (target triple stripped), so ship ONLY bun.exe. The build-time
          # triple-qualified copy in src-tauri/binaries is not needed at runtime.
          Copy-Item -Path "src-tauri/binaries/bun-x86_64-pc-windows-msvc.exe" -Destination "$rel/bun.exe" -Force
          # Backend bundle + web SPA (consumed by the Bun sidecar at runtime).
          New-Item -ItemType Directory -Force -Path "$rel/backend","$rel/web" | Out-Null
          Copy-Item -Path "dist/*" -Destination "$rel/backend/" -Recurse -Force
          Copy-Item -Path "web/dist/*" -Destination "$rel/web/" -Recurse -Force

          # Stage ONLY the runtime files into one clean app folder. The release dir
          # also contains Cargo build artifacts (build/, deps/, fingerprint/, *.pdb)
          # which must not ship.
          $out = "TBAi-windows-x64-portable"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path "$rel/TBAi.exe" -Destination "$out/" -Force
          Copy-Item -Path "$rel/bun.exe" -Destination "$out/" -Force
          Copy-Item -Path "$rel/backend" -Destination "$out/backend" -Recurse -Force
          Copy-Item -Path "$rel/web" -Destination "$out/web" -Recurse -Force
          Get-ChildItem "$out" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbai-windows-x64-portable
          path: TBAi-windows-x64-portable
          if-no-files-found: error
