<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>TBAi</title>
    <script>
      // Pre-apply the saved theme before first paint (no flash). Mirrors
      // ThemeProvider defaults: tbai-theme in localStorage, else dark.
      try {
        var t = localStorage.getItem("tbai-theme");
        var theme = t === "light" || t === "dark" ? t : "dark";
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0a" : "#ffffff");
      } catch (e) { /* storage unavailable — class="dark" default stands */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
