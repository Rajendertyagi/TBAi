<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>TBAi</title>
    <script>
      // Pre-apply the saved theme before first paint (no flash).
      //
      // This mirrors ThemeProvider exactly, and deliberately carries NO colour
      // logic: the palettes live in `src/styles/themes.css`, so all this has to do
      // is set the mode class and the theme attribute and let the (render-blocking)
      // stylesheet do the rest. That is what keeps this bootstrap from drifting away
      // from the provider.
      //
      // Keys: tbai-theme (mode), tbai-theme-light / tbai-theme-dark (palette per
      // mode). An unknown or missing palette id simply matches no generated block,
      // which leaves the stylesheet's own colours — TBAi's existing look — standing.
      try {
        var t = localStorage.getItem("tbai-theme");
        var theme = t === "light" || t === "dark" ? t : "dark";
        var root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(theme);
        var id = localStorage.getItem(theme === "dark" ? "tbai-theme-dark" : "tbai-theme-light");
        if (id && id !== "classic") root.setAttribute("data-tbai-theme", id);
        // Browser chrome should match the resolved background, whatever it turned
        // out to be. Read it back from the cascade rather than duplicating colours.
        var meta = document.querySelector('meta[name="theme-color"]');
        var bg = getComputedStyle(root).getPropertyValue("--background").trim();
        if (meta && bg) meta.setAttribute("content", bg);
      } catch (e) { /* storage unavailable — class="dark" default stands */ }
      // Pre-apply saved typography & scale before first paint (no flash / layout shift).
      try {
        var tyRaw = localStorage.getItem("tbai-typography");
        if (tyRaw) {
          var ty = JSON.parse(tyRaw);
          if (ty && ty.version === 1) {
            var r = document.documentElement;
            if (typeof ty.baseSize === "number" && ty.baseSize >= 12 && ty.baseSize <= 24 && ty.baseSize !== 16) {
              r.style.zoom = String(ty.baseSize / 16);
            }
            if (typeof ty.fontWeight === "number" && ty.fontWeight >= 100 && ty.fontWeight <= 900 && ty.fontWeight !== 400) {
              r.style.setProperty("--font-weight-base", String(ty.fontWeight));
            }
            var monoWeight = typeof ty.monoFontWeight === "number" ? ty.monoFontWeight : ty.fontWeight;
            if (typeof monoWeight === "number" && monoWeight >= 100 && monoWeight <= 900 && monoWeight !== 400) {
              r.style.setProperty("--font-weight-mono", String(monoWeight));
            }
            if (typeof ty.codeFontSize === "number" && ty.codeFontSize >= 11 && ty.codeFontSize <= 20 && ty.codeFontSize !== 13) {
              r.style.setProperty("--code-font-size", String(ty.codeFontSize) + "px");
            }
            if (typeof ty.lineHeight === "number" && ty.lineHeight !== 1.5) {
              r.style.setProperty("--font-line-height", String(ty.lineHeight));
            }
            var FONT_MAP = {
              "inter": '"Inter Variable", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
              "sf-pro": '-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif',
              "roboto": '"Roboto Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
              "open-sans": '"Open Sans Variable", -apple-system, BlinkMacSystemFont, sans-serif',
              "source-sans-3": '"Source Sans 3 Variable", -apple-system, BlinkMacSystemFont, sans-serif',
              "plus-jakarta-sans": '"Plus Jakarta Sans Variable", -apple-system, BlinkMacSystemFont, sans-serif',
              "outfit": '"Outfit Variable", -apple-system, BlinkMacSystemFont, sans-serif',
              "figtree": '"Figtree Variable", -apple-system, BlinkMacSystemFont, sans-serif',
              "lato": '"Lato", -apple-system, BlinkMacSystemFont, sans-serif',
              "system": 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
            };
            var MONO_MAP = {
              "jetbrains-mono": '"JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
              "fira-code": '"Fira Code Variable", ui-monospace, monospace',
              "source-code-pro": '"Source Code Pro Variable", ui-monospace, monospace',
              "sf-mono": '"SF Mono", Consolas, "Liberation Mono", Menlo, monospace',
              "system-mono": 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
            };
            if (ty.fontFamily && FONT_MAP[ty.fontFamily]) {
              r.style.setProperty("--font-sans", FONT_MAP[ty.fontFamily]);
            }
            if (ty.monoFontFamily && MONO_MAP[ty.monoFontFamily]) {
              r.style.setProperty("--font-mono", MONO_MAP[ty.monoFontFamily]);
            }
          }
        }
      } catch (e) { /* storage unavailable — stylesheet defaults stand */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
